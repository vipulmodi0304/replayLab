<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="description" content="Record API baselines, replay requests against your next build, and review every difference like a code review." />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" />
    <title>ReplayLab | Review API changes like code</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem("rl-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
