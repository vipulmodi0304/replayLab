services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replaylab
      POSTGRES_PASSWORD: replaylab_local
      POSTGRES_DB: replaylab
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replaylab -d replaylab"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replaylab:replaylab_local@postgres:5432/replaylab
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replaylab:replaylab_local@postgres:5432/replaylab
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:8080
      NODE_ENV: development
      SERVE_WEB: "true"
      PORT: 4000
    ports: ["127.0.0.1:8080:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replaylab:replaylab_local@postgres:5432/replaylab
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    command: ["node", "services-dist/apps/worker/src/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  pgdata:
  redisdata:
